name: firebase_template
description: Multi-environment Firebase Flutter template with phone, email, Google and Apple auth.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.3
  go_router: ^14.2.0
  flutter_riverpod: ^2.6.1
  app_links: ^6.0.0
  firebase_app_check: ^0.3.0
  firebase_crashlytics: ^4.0.0
  firebase_remote_config: ^5.0.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.0.0
  firebase_analytics: ^11.0.0
  logger: ^2.0.0
  package_info_plus: ^8.0.0
  purchases_flutter: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
